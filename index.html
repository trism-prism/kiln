<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kiln</title>
    <meta name="description" content="Turns any study plan into a daily to-do list with reminders and reviews." />
    <!-- Link previews. The image is a 1200x630 screenshot of the Dashboard with the sample plans (public/og-image.png). -->
    <meta property="og:title" content="Kiln" />
    <meta property="og:description" content="A local-first study planner that turns a study plan into a scheduled to-do list with reminders and spaced-repetition reviews." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kilnstudy.com" />
    <meta property="og:image" content="https://kilnstudy.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Kiln Dashboard showing two study plans with progress and expected finish dates." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://kilnstudy.com/og-image.png" />
    <!-- Browser toolbar color. Keep in sync with --kiln-surface in src/index.css. -->
    <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/kiln-arch.svg" type="image/svg+xml" />
    <!-- iOS: installed from Share > Add to Home Screen; the web manifest alone is not enough there. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kiln" />
    <script>
      // Apply the saved theme before first paint. Keep the key and values in sync with src/app/theme.ts.
      try {
        var t = localStorage.getItem('kiln-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <!--
      Cloudflare Web Analytics (cookieless). Added at deploy time: copy the snippet from the
      Cloudflare dashboard (Analytics & Logs > Web Analytics) and paste it here, replacing this comment.
      It looks like: <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "..."}'></script>
      No token is committed.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
