# orca.yaml: Orca reads this at the repo root when it creates a worktree.
# scripts.setup runs once per new worktree. Keep it idempotent and fast; never put secrets here.
# Gitignored files a worktree needs (.env*) are listed in .worktreeinclude (literal paths, one per line).
scripts:
  setup: |
    npm ci
    npm ci --prefix worker
